name: Release

# Ein Tag wie v0.2.0 baut Installer für Windows (NSIS, MSI) und Linux (AppImage, deb, rpm),
# signiert die Update-Pakete und legt ein Release als Entwurf an, inklusive latest.json für
# den eingebauten Updater. Den Entwurf prüfen und dann veröffentlichen.
#
# Secrets und Variable kommen aus der Umgebung „TAURI“ (oder dem Repository).
# Benötigte Secrets:  TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# Optionale Secrets:  PINECONE_MSA_CLIENT_ID
# Optionale Variable: PINECONE_DISCORD_CLIENT_ID (Discord-Status; Application-ID ist öffentlich)
# Optionale Variable: PINECONE_EVENTPACK_KEYS (öffentliche Schlüssel für Event-Packs, keyId=Base64;…)
# CurseForge läuft über den Pinecone-Server; der API-Schlüssel gehört nicht in den Launcher.
# Variable:           PINECONE_UPDATE_PUBKEY (öffentlicher Schlüssel, Inhalt der .pub-Datei)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # Signatur-Secrets und PINECONE_UPDATE_PUBKEY liegen in der Umgebung „TAURI“.
    environment: TAURI
    steps:
      - uses: actions/checkout@v4

      - name: Version des Tags prüfen
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "Tag $tag, tauri.conf $conf, package.json $pkg, Cargo $cargo"
          [ "$tag" = "$conf" ] && [ "$tag" = "$pkg" ] && [ "$tag" = "$cargo" ] || {
            echo "::error::Versionen passen nicht zum Tag (siehe RELEASING.md)"; exit 1; }

      - name: Signatur-Secrets prüfen
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBKEY: ${{ vars.PINECONE_UPDATE_PUBKEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY fehlt oder ist leer (Umgebung „TAURI“ oder Repository secrets)"; exit 1; }
          [ -n "$PUBKEY" ] || { echo "::error::Variable PINECONE_UPDATE_PUBKEY fehlt (Tab „Variables“, Umgebung „TAURI“ oder Repository variables)"; exit 1; }

      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Der Bundler prüft die frische Signatur gegen plugins.updater.pubkey aus der Konfiguration.
      - name: Öffentlichen Schlüssel in die Release-Konfiguration
        shell: bash
        env:
          PUBKEY: ${{ vars.PINECONE_UPDATE_PUBKEY }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.release.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.plugins = { updater: { pubkey: process.env.PUBKEY.trim() } };
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
          '

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Werden beim Bauen einkompiliert (siehe README).
          PINECONE_MSA_CLIENT_ID: ${{ secrets.PINECONE_MSA_CLIENT_ID }}
          PINECONE_DISCORD_CLIENT_ID: ${{ vars.PINECONE_DISCORD_CLIENT_ID }}
          PINECONE_EVENTPACK_KEYS: ${{ vars.PINECONE_EVENTPACK_KEYS }}
          PINECONE_UPDATE_PUBKEY: ${{ vars.PINECONE_UPDATE_PUBKEY }}
          # Wo installierte Launcher nach Updates suchen: standardmäßig die Releases dieses Repos
          # (Kanal Release = ohne Pre-release, Beta = alle); mit der Variable PINECONE_UPDATE_URL
          # eine eigene Adresse ({channel} wird zu release bzw. beta).
          PINECONE_UPDATE_REPO: ${{ !vars.PINECONE_UPDATE_URL && github.repository || '' }}
          PINECONE_UPDATE_URL: ${{ vars.PINECONE_UPDATE_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: TwoGG Pinecone ${{ github.ref_name }}
          releaseBody: Änderungen siehe CHANGELOG.md. Windows-Installer (.exe/.msi), Linux (AppImage, .deb, .rpm). Beta-Versionen als Pre-release veröffentlichen.
          releaseDraft: true
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json

  # Windows-Installer über die SignPath Foundation signieren (kostenlos für Open Source, siehe
  # site/code-signing.html und RELEASING.md). Läuft nur, wenn SIGNPATH_ORGANIZATION_ID gesetzt ist;
  # bis dahin bleiben die Installer wie bisher unsigniert.
  #
  # Ablauf: die unsignierten Installer aus dem Release-Entwurf holen, bei SignPath signieren
  # lassen (Freigabe von Hand in SignPath), Updater-Signaturen (.sig) für die neuen Dateien
  # erzeugen und Installer, .sig und latest.json im Entwurf ersetzen. Die Dateinamen bleiben
  # gleich, die Update-Adressen in latest.json also auch.
  #
  # Variablen: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG
  #            (z. B. release-signing), optional SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
  # Secret:    SIGNPATH_API_TOKEN (Token eines CI-Benutzers in SignPath)
  windows-signieren:
    name: Windows-Installer signieren
    needs: build
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-22.04
    environment: TAURI
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Unsignierte Installer aus dem Entwurf holen
        run: |
          mkdir -p unsigned
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D unsigned -p '*_x64-setup.exe' -p '*_x64_*.msi'
          ls -l unsigned

      - name: Für SignPath hochladen
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigniert
          path: unsigned/*
          if-no-files-found: error

      - name: Bei SignPath signieren
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          # Die Freigabe passiert von Hand; bis zu 3 Stunden warten.
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: signed

      - name: Updater-Signaturen neu erzeugen
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          files=(signed/*.exe signed/*.msi)
          [ ${#files[@]} -gt 0 ] || { echo "::error::SignPath hat keine Installer geliefert"; exit 1; }
          for f in "${files[@]}"; do
            cmp -s "$f" "unsigned/$(basename "$f")" && { echo "::error::$f ist unverändert, also nicht signiert"; exit 1; }
            rm -f "$f.sig"
            npx tauri signer sign "$f"
          done
          ls -l signed

      - name: Installer, .sig und latest.json im Entwurf ersetzen
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber signed/*
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p latest.json -O latest.json --clobber
          node -e '
            const fs = require("fs");
            const path = require("path");
            const manifest = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            let replaced = 0;
            for (const [platform, entry] of Object.entries(manifest.platforms)) {
              if (!platform.startsWith("windows-")) continue;
              const name = decodeURIComponent(entry.url.split("/").pop());
              const sig = path.join("signed", name + ".sig");
              if (!fs.existsSync(sig)) throw new Error(`Keine neue Signatur für ${platform} (${name})`);
              entry.signature = fs.readFileSync(sig, "utf8").trim();
              replaced++;
            }
            if (!replaced) throw new Error("latest.json enthält keine Windows-Einträge");
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
            console.log(`${replaced} Windows-Signaturen in latest.json ersetzt`);
          '
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber latest.json
